# Frozen data-product contracts — generation 1 (v1), superseded 2026-09-08
#
# Single source of truth for local free-only data-product APIs and consumers.
# Machine-checked by: infra/scripts/utils/data_product_contract_guard.py
#
# Policy: breaking changes require a NEW schema_version (e.g. crypto.v2).
# Do not mutate these v1 rows in place. See data-product-versioning-policy.md.

freeze_id: data-product-contracts-v1
status: superseded
created: 2026-08-04
host_default: 127.0.0.1
bind_policy: loopback_only_by_default
transport: http
methods:
  allowed_for_consumers: [GET]
  blocked_by_default: [POST]
endpoints:
  required:
    - GET /healthz
    - GET /v1/metadata
    - GET /v1/records
    - GET /v1/records/{record_id}
    - GET /v1/history
  refresh:
    method: POST
    path: /v1/refresh
    default_status: 403
    note: Disabled unless ALLOW_REFRESH=true and REFRESH_TOKEN matches.

envelope:
  required_keys:
    - schema_version
    - source
    - retrieved_at
    - data_status
    - items
    - next_cursor
  data_status_values:
    - ok
    - empty
    - stale
    - malformed
    - not_found
    - forbidden
    - error
    - accepted

policy_defaults:
  FREE_ONLY: true
  ALLOW_PAID_PROVIDERS: false
  ALLOW_EXTERNAL_WRITES: false
  ALLOW_REFRESH: false

# Port map is reserved. Do not reassign ports without a new freeze generation.
products:
  - id: crypto
    port: 8101
    schema_version: crypto.v1
    repository: book-crypto-data
    package: book_crypto
    role: domain_source
  - id: stocks
    port: 8102
    schema_version: stock.v1
    repository: book-stock-data
    package: book_stock
    role: domain_source
  - id: fx
    port: 8103
    schema_version: fx.v1
    repository: book-fx-data
    package: book_fx
    role: domain_source
  - id: defi
    port: 8104
    schema_version: defi.v1
    repository: book-defi-data
    package: book_defi
    role: domain_source
  - id: flights
    port: 8105
    schema_version: flight.v1
    repository: book-flight-data
    package: book_flight
    role: domain_source
  - id: seo
    port: 8106
    schema_version: seo.v1
    repository: book-seo-data
    package: book_seo
    role: domain_source
  - id: ai_tools
    port: 8107
    schema_version: ai_tools.v1
    repository: book-ai-tools-data
    package: book_ai_tools
    role: domain_source
  - id: opportunities
    port: 8108
    schema_version: opportunity.v1
    repository: book-opportunity-intelligence
    package: book_opportunities
    role: synthesis_consumer
    consumes_ports: [8101, 8102, 8103, 8104, 8105, 8106, 8107]

consumers:
  - id: solo-empire-insights
    path: projects/product/engineering/book-dev/github/bookchaowalit/public/book-products/insights-dashboard
    catalog_files:
      - src/data-products/catalog.ts
      - js/data-products-browser.js
    must_match_ports: [8101, 8102, 8103, 8104, 8105, 8106, 8107, 8108]
  - id: bookchaowalit-portfolio-frontend
    path: projects/product/engineering/book-dev/github/bookchaowalit-website/public/book-apps/portfolio/portfolio-portfolio-web
    catalog_files:
      - src/lib/data-products/catalog.ts
    must_match_ports: [8101, 8102, 8103, 8104, 8105, 8106, 8107, 8108]
  - id: book-opportunity-intelligence
    path: projects/product/engineering/book-dev/github/bookchaowalit/book-apps/tools/book-opportunity-intelligence
    catalog_files:
      - src/book_opportunities/config.py
    must_match_ports: [8101, 8102, 8103, 8104, 8105, 8106, 8107]
    serves_port: 8108
  # Track A — opportunity consumers (must use opportunity.v1 / :8108; never money_opportunities*.csv)
  - id: catalog-cross-match
    path: catalog/automation
    catalog_files:
      - cross_match_opportunities.py
    must_match_ports: [8108]
    role: opportunity_consumer
  - id: infra-opportunity-client
    path: infra/scripts/utils
    catalog_files:
      - opportunity_client.py
    must_match_ports: [8108]
    role: opportunity_consumer

# Job consumers (import_job_scraper, book-sales leads, jobsdb) are Track B.
# Their separate contract is systems/architecture/job-data-contract-v1.yaml:
# book-job-data → job.v1 / :8109 — never opportunity.v1.

producer_root: projects/product/engineering/book-dev/github/bookchaowalit/public/book-apps/tools

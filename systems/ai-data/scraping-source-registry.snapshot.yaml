schema_version: solo-empire.scraping-source-registry-snapshot.v1
kind: public-source-registry-snapshot
owner: data-product-owner
provenance:
  repository: bookchaowalit/career-job-scraper
  local_path: projects/product/engineering/book-dev/github/bookchaowalit/public/book-apps/tools/career-job-scraper
  commit: 960012276311f4c7c77b8555b4208880ac45cec1
  path: config/source_coverage.yaml
  projection_fields:
  - job
  - business
  - source
  - channel
  - schedule
  - status
  - owner_repository
policy:
  metadata_only: true
  live_readiness: unknown_without_runtime_registry
  missing_required_jobs: owned_inventory_gap_not_registered_source
  update_contract:
  - ต้นฉบับ metadata เป็นของ book-job-scraping/config/source_coverage.yaml; สำเนาที่ติดตามใน repo หลักใช้ตรวจ metadata เมื่อไม่มี checkout ของเจ้าของ
  - ตรวจว่า checkout ของเจ้าของไม่มีการแก้ค้าง แล้วอ่าน config/source_coverage.yaml ที่ commit ระบุชัดเจนด้วย git show; ห้ามคัดลอก capture payloads, credentials, URL query strings หรือ environment files
  - คัดลอกเฉพาะ provenance.projection_fields โดยคง declared statuses แล้วอัปเดต provenance.commit และรัน scraping_coverage_test.py รวมการตรวจ parity กับ commit ที่ระบุ
  - งานที่ต้องการแต่ยังไม่มีในทะเบียนให้คง inventory_gap ใน requirements และ next_action ของเจ้าของไว้; เพิ่ม source rows เมื่อเจ้าของลงทะเบียนแล้วเท่านั้น
  - เมื่อ runtime_path มีไฟล์ให้ใช้ metadata ที่เจ้าของประกาศ; ไฟล์ malformed ต้องแจ้ง error ส่วนสถานะ active/migrated ใน snapshot ต้องถือว่า readiness ยัง unknown

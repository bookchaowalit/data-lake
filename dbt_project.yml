name: solo_empire_lake
version: "1.0.0"
config-version: 2

profile: solo_empire_lake

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Repo-root-relative path to the Bronze Parquet root. Overridable so CI
  # or another checkout layout can point elsewhere without editing SQL.
  bronze_root: "../../data/lake-local/bronze"

models:
  solo_empire_lake:
    staging:
      +materialized: view
    marts:
      +materialized: table
